<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exemple d'écran de conduite · circulation de refroidissement</title><style>/* Maquette IHM V2 — MTP1000 (1280 x 800, 10,1" : 1 px = 0,17 mm) — Charte IHM SC v1.1 */
/* Tailles de texte (charte § 2, x 1,4 pour 1280 x 800) : rien sous 16 px, texte courant 20 px, valeurs 24 a 44 px */
:root{--bg:#0A1422;--card:#0F1D31;--nav:#0B1828;--sel:#162844;--bord:#192B47;--volet:#2E4466;--acc:#FFC62E;--txt2:#98ABC2;--ok:#2FB35C;--def:#E5484D;--warn:#FF8A00;--maint:#29B6F6;--glace:#3B8FE0;--demin:#2BB5A8}
.ihm{position:relative;width:1280px;height:800px;background:var(--bg);color:#fff;overflow:hidden;font-family:Inter,"Segoe UI",Carlito,"DejaVu Sans",sans-serif;user-select:none}
.ihm *{box-sizing:border-box}
/* entete 0002 : 80 px dont filet jaune 3 px */
.hd{position:absolute;left:0;top:0;width:1280px;height:80px;background:var(--card);border-bottom:3px solid var(--acc);display:flex;align-items:center;padding:0 16px;gap:14px}
.hd .lg{height:48px}
.hd .tt{display:flex;flex-direction:column;line-height:1.15}
.hd .tt b{font-size:24px;font-weight:700;white-space:nowrap}.hd .tt b i{font-style:normal;color:var(--acc)}
.hd .tt span{font-size:16px;color:var(--txt2);white-space:nowrap}
.pill{display:flex;align-items:center;gap:9px;height:44px;border:2px solid var(--ok);color:var(--ok);border-radius:22px;padding:0 18px;font-weight:700;font-size:19px;white-space:nowrap}
.pill i{width:14px;height:14px;border-radius:50%;background:currentColor}
.pill.def{border-color:var(--def);color:var(--def)}.pill.warn{border-color:var(--warn);color:var(--warn)}.pill.off{border-color:var(--txt2);color:var(--txt2)}
.pill.blink i{animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:.15}}
.usr{font-size:18px;color:var(--txt2);white-space:nowrap;line-height:1.2}.usr b{color:#fff;display:block}
.hd .sp{flex:1}
.dt{text-align:right;line-height:1.15;white-space:nowrap}.dt b{font-size:22px;font-weight:700;display:block}.dt span{font-size:16px;color:var(--txt2)}
.zb{background:#fff;border-radius:6px;padding:4px 8px;height:50px;display:flex;align-items:center}.zb img{height:40px}
.mn{width:56px;height:56px;background:var(--sel);border:1px solid var(--bord);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ihm.navon .mn{visibility:hidden}
/* zone de travail */
.wk{position:absolute;left:0;top:80px;width:1280px;height:720px;padding:16px 32px}
.ti{font-size:30px;font-weight:700;margin:0;line-height:1.15}.st{font-size:18px;color:var(--txt2);margin:4px 0 0}
.cd{position:absolute;background:var(--card);border:1px solid var(--bord);border-radius:8px;padding:16px 20px}
.lb{font-size:16px;letter-spacing:1.5px;color:var(--txt2);text-transform:uppercase;margin-bottom:12px;white-space:nowrap}
.btn{display:flex;align-items:center;justify-content:center;background:var(--sel);border:1px solid var(--bord);font-weight:700;font-size:21px;color:#fff;cursor:pointer;text-align:center}
.btn.sel{border:2px solid var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn.dis{color:#4A5A72}
.vy{display:flex;align-items:center;gap:12px;font-size:19px;margin:0 0 13px}
.vy i{width:22px;height:22px;border-radius:50%;background:var(--sel);border:1px solid #23395A;flex:none}
.vy i.on{background:var(--ok);border-color:var(--ok)}.vy i.df{background:var(--def);border-color:var(--def)}.vy i.mt{background:var(--maint);border-color:var(--maint)}.vy i.wn{background:var(--warn);border-color:var(--warn)}
.io{display:inline-flex;align-items:center;justify-content:flex-end;min-width:130px;height:46px;padding:0 12px;border:1px solid #fff;background:var(--bg);font-size:22px;font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;font-size:20px;margin-bottom:13px;gap:12px}
.row span{color:#fff}.row em{font-style:normal;color:var(--txt2);font-size:16px;margin-left:8px}
.ret{position:absolute;left:32px;bottom:20px;width:190px;height:60px}
.tab{width:100%;border-collapse:collapse;font-size:19px}
.tab th{font-weight:400;font-size:17px;color:var(--txt2);text-align:left;padding:11px 14px;border-bottom:1px solid var(--bord)}
.tab td{padding:11px 14px;border-bottom:1px solid var(--bord)}
.tab td.r,.tab th.r{text-align:right}
.note{font-size:17px;color:var(--txt2);line-height:1.35}
.hyp{color:var(--acc)}
/* volet de navigation 0004 : a droite, fond #0B1828, filet #2E4466, ferme au demarrage */
.nav{position:absolute;right:0;top:80px;width:260px;height:720px;background:var(--nav);border-left:3px solid var(--volet);padding:12px 12px;display:none;z-index:6}
.ihm.navon .nav{display:block}
.nav .nt{display:flex;justify-content:space-between;align-items:center;font-size:16px;letter-spacing:3px;color:var(--txt2);padding:4px 4px 14px 10px}
.nav .it{display:flex;align-items:center;gap:16px;height:66px;padding:0 14px;font-size:22px;cursor:pointer;margin-bottom:6px}
.nav .it.on{background:var(--sel);color:var(--acc);font-weight:700}
.nav .it .bd{margin-left:auto;background:var(--def);color:#fff;border-radius:15px;font-size:17px;min-width:36px;height:30px;display:flex;align-items:center;justify-content:center;font-weight:700}
.nav .it.sys{position:absolute;bottom:12px;left:12px;right:12px;margin:0}
/* synoptique */
.syn text{font-family:Inter,"Segoe UI",Carlito,sans-serif}
.flow{stroke-dasharray:10 12;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-22}}
.rot{transform-box:fill-box;transform-origin:center;animation:rt 1.4s linear infinite}
@keyframes rt{to{transform:rotate(360deg)}}
.pmp{cursor:pointer}
/* bandeau de securite (AU seulement) : bas de la zone de travail */
.ban{position:absolute;left:0;right:0;bottom:0;height:42px;background:#3A1218;border-top:2px solid var(--def);display:flex;align-items:center;justify-content:center;gap:12px;font-weight:700;font-size:20px;color:#fff;z-index:5}
/* marche / arret general (accueil) */
.btn.dgr{border:2px solid var(--def)}
.btn.press{box-shadow:0 0 0 5px rgba(255,198,46,.55)}
.dlgv{position:absolute;inset:0;background:rgba(6,16,28,.72);display:flex;align-items:center;justify-content:center;z-index:8}
.dlg{width:600px;background:var(--card);border:1px solid var(--bord);border-top:4px solid var(--def);border-radius:8px;padding:28px 32px;display:flex;flex-direction:column;gap:16px}
.dlg h3{margin:0;font-size:26px}.dlg p{margin:0;font-size:19px;color:var(--txt2);line-height:1.4}

html,body{margin:0;background:#06101C;color:#fff;font-family:Inter,"Segoe UI",Carlito,sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;max-width:1312px;margin:0 auto}
.bar b{color:#FFC62E;margin-right:8px}.bar button{font:inherit;font-size:14px;color:#fff;background:#162844;border:1px solid #192B47;border-radius:6px;padding:6px 12px;cursor:pointer}
.bar button.on{background:#FFC62E;color:#0A1422;border-color:#FFC62E;font-weight:600}
.fr{width:1280px;margin:0 auto 24px;border:16px solid #1b1f24;border-radius:12px;box-sizing:content-box}
body.cap .bar{display:none}body.cap .fr{border:0;margin:0;border-radius:0}
</style></head><body>
<div class="bar"><b>Exemple d'écran de conduite · Siemens MTP1000</b><span id="vb"></span><span style="flex:1"></span>
<button data-sc="normal" class="on">Marche normale</button><button data-sc="alarme">Défaut + coupure</button><button data-sc="arret">Arrêt général</button></div>
<div class="fr"><div id="ihm" class="ihm"></div></div>
<script>/* Maquette IHM V2 — MTP1000 (1280 x 800) — moteur de rendu commun (maquette cliquable + animation)
   Charte IHM SC v1.1 : vues 0000 Accueil, 1xxx Système, 2xxx Maintenance, 3xxx Alarmes, 4xxx Manuel (circuits), 5xxx Production (réglages) */
var IHM = (function(){
'use strict';
var C = [
  {id:'F',  rep:'5-6', nom:'Filtre',                          ct:'Filtre',          desc:'Cuve eau glacée ↔ échangeur du filtre',     p:['5','6'],       ve:true,  kw:'7,5 kW', fl:'glace'},
  {id:'17', rep:'17',  nom:'Eau déminéralisée — primaire',    ct:'Éch. primaire',   desc:'Cuve eau glacée ↔ échangeur',               p:['17-1','17-2'], ve:true,  kw:'15 kW',  fl:'glace'},
  {id:'18', rep:'18',  nom:'Eau déminéralisée — secondaire',  ct:'Éch. secondaire', desc:'Échangeur ↔ cuve eau déminéralisée',        p:['18-1','18-2'], ve:true,  kw:'15 kW',  fl:'demin'},
  {id:'11', rep:'11',  nom:'Induction AMP20S',                ct:'AMP20S',          desc:'Cuve eau démin. ↔ induction AMP20S',        p:['11-1','11-2'], ve:false, kw:'5,5 kW', fl:'demin'},
  {id:'13', rep:'13',  nom:'Induction AMP30',                 ct:'AMP30',           desc:'Cuve eau démin. ↔ induction AMP30',         p:['13-1','13-2'], ve:true,  kw:'7,5 kW', fl:'demin'}
];
var COL = {bg:'#0A1422',card:'#0F1D31',sel:'#162844',bord:'#192B47',acc:'#FFC62E',txt2:'#98ABC2',ok:'#2FB35C',def:'#E5484D',warn:'#FF8A00',maint:'#29B6F6',glace:'#3B8FE0',demin:'#2BB5A8',off:'#5B6B80'};
/* icônes : jeu d'icônes SC, + réglages */
var ICO = {
  acc:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
  man:'<path d="M8 13V5a2 2 0 014 0v6M12 11V4a2 2 0 014 0v8M16 11V7a2 2 0 014 0v7a7 7 0 01-14 0v-3a2 2 0 014 0"/>',
  reg:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  mnt:'<path d="M14.7 6.3a4 4 0 00-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 005.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"/>',
  alm:'<path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"/>',
  sys:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>',
  menu:'<path d="M4 7h16M4 12h16M4 17h16"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>'
};
function ico(k, c, s){ s=s||30; return '<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="'+c+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICO[k]+'</svg>'; }
function fr(v, d){ return v.toFixed(d===undefined?1:d).replace('.', ','); }
function cdef(id){ for(var i=0;i<C.length;i++) if(C[i].id===id) return C[i]; }

function base(){
  var S = {view:'0000', cid:'17', nav:false, user:'Opérateur', now:'16/11/2026 14:32', Tg:17.4, Td:22.1, au:false, gen:true, confirm:false, press:'', lang:'FR', P:{}, M:{}, alarms:[]};
  var h = {'5':1312,'6':1290,'17-1':842,'17-2':815,'18-1':840,'18-2':812,'11-1':2104,'11-2':2071,'13-1':1987,'13-2':1950};
  var sp = {F:80,'17':75,'18':75,'11':100,'13':85};
  C.forEach(function(c){ S.M[c.id]={mode:'A', prio:c.p[0], per:168, next:c.id==='13'?2:37};
    c.p.forEach(function(p){ S.P[p]={run:0, def:0, cp:0, hs:0, spd:sp[c.id], h:h[p], n:Math.round(h[p]/31)}; }); });
  return S;
}
function scene(name){
  var S = base();
  /* maquette : la pompe principale n'est pas toujours la première de la paire (effet de l'alternance) */
  S.M['17'].prio='17-2'; S.M['13'].prio='13-2'; S.M['13'].next=95;
  if(name==='normal' || name==='nav' || name==='alarme'){
    ['5','17-2','18-1','11-1','13-2'].forEach(function(p){ S.P[p].run=1; });
  }
  if(name==='nav'){ S.nav=true; }
  if(name==='confirm'){ ['5','17-2','18-1','11-1','13-2'].forEach(function(p){ S.P[p].run=1; }); S.confirm=true; }
  if(name==='arret'){ S.gen=false; }
  if(name==='alarme'){
    S.P['11-1'].run=0; S.P['11-1'].def=1; S.P['11-2'].run=1;
    S.P['5'].run=0; S.P['5'].cp=1; S.P['6'].run=1;
    S.alarms=[
      {d:'16/11/2026 14:31:07', e:'Entrant', c:'Défaut', t:'Pompe 11-1 : défaut — basculement sur 11-2'},
      {d:'16/11/2026 14:20:44', e:'Entrant', c:'Avertissement', t:'Pompe 5 : coupure de proximité ouverte'},
      {d:'16/11/2026 08:02:13', e:'Sortant', c:'Défaut', t:'Arrêt d\'urgence armoire'}
    ];
  }
  return S;
}
function pst(p){ return p.def?'def':(p.cp||p.hs)?'mt':p.run?'on':'off'; }
function pcol(p){ var s=pst(p); return s==='def'?COL.def:s==='mt'?COL.maint:s==='on'?COL.ok:COL.off; }
function plib(p){ var s=pst(p); return s==='def'?'En défaut':p.cp?'Coupure ouverte':p.hs?'Hors service':s==='on'?'En marche':'À l\'arrêt'; }
function crun(S,c){ return c.p.some(function(p){return S.P[p].run;}); }
function actives(S){ return S.alarms.filter(function(a){return a.e==='Entrant';}); }

/* ---------------------------------------------------------------- entête 0002, navigation 0004 */
function header(S, L){
  var nd = actives(S).filter(function(a){return a.c==='Défaut';}).length, nw = actives(S).length;
  var any = C.some(function(c){return crun(S,c);});
  var pill = S.au ? '<div class="pill def blink"><i></i>Arrêt d\'urgence</div>' :
             nd ? '<div class="pill def blink"><i></i>Défaut</div>' :
             nw ? '<div class="pill warn"><i></i>Avertissement</div>' :
             (any||S.gen) ? '<div class="pill"><i></i>En service</div>' : '<div class="pill off"><i></i>À l\'arrêt</div>';
  return '<div class="hd"><img class="lg" src="'+L.sari+'" alt="">'+
    '<div class="tt"><b>Circulation <i>Refroidissement</i></b><span>Pompes de circulation</span></div>'+pill+
    '<div class="usr">Utilisateur<b>'+S.user+'</b></div><div class="sp"></div>'+
    '<div class="dt"><b>'+S.now+'</b><span>Automate en ligne</span></div>'+
    
    '<div class="mn" data-act="nav">'+ico('menu',COL.acc,34)+'</div></div>';
}
var NAV = [['0000','acc','Accueil'],['4000','man','Circuits'],['5000','reg','Réglages'],['2000','mnt','Maintenance'],['3000','alm','Alarmes']];
function nav(S){
  var n = actives(S).length, cur = S.view==='0000'?'0':S.view.charAt(0);
  var h = '<div class="nav"><div class="nt">NAVIGATION<span data-act="nav" style="cursor:pointer;display:flex">'+ico('x',COL.txt2,32)+'</span></div>';
  NAV.forEach(function(x){ var on = x[0]==='0000' ? cur==='0' : cur===x[0].charAt(0);
    h += '<div class="it'+(on?' on':'')+'" data-view="'+x[0]+'">'+ico(x[1], on?COL.acc:'#FFFFFF')+x[2]+(x[0]==='3000'&&n?'<span class="bd">'+n+'</span>':'')+'</div>'; });
  var on1 = cur==='1';
  h += '<div class="it sys'+(on1?' on':'')+'" data-view="1000">'+ico('sys', on1?COL.acc:'#FFFFFF')+'Système</div></div>';
  return h;
}
function titre(t, s){ return '<p class="ti">'+t+'</p>'+(s?'<p class="st">'+s+'</p>':''); }

/* ---------------------------------------------------------------- 0000 synoptique */
var MS = ' stroke="#0A1422" stroke-width="6" paint-order="stroke"';
function pumpSVG(S, id, x, y, dir){
  var p = S.P[id], c = pcol(p), s = pst(p), cd = cdef(id==='5'||id==='6'?'F':id.split('-')[0]);
  var g = '<g class="pmp" data-cid="'+cd.id+'" transform="translate('+x+','+y+')">';
  g += '<circle r="19" fill="'+(s==='off'?COL.card:c)+'" stroke="'+(s==='off'?COL.off:c)+'" stroke-width="3"/>';
  if(s==='on') g += '<g class="rot"><path d="M0 -13 L3.5 -3.5 L-3.5 -3.5 Z M11.3 6.5 L3 1.8 L6.6 -4.4 Z M-11.3 6.5 L-6.6 -4.4 L-3 1.8 Z" fill="#0A1422" opacity=".35"/></g>';
  g += '<path d="'+(dir>0?'M-7 -9.5 L10.5 0 L-7 9.5 Z':'M7 -9.5 L-10.5 0 L7 9.5 Z')+'" fill="'+(s==='off'?'none':'#0A1422')+'" stroke="'+(s==='off'?COL.off:'#0A1422')+'" stroke-width="1.8"/>';
  if(s==='def') g += '<text x="0" y="-25" text-anchor="middle" font-size="20" font-weight="700" fill="'+COL.def+'"'+MS+'>!</text>';
  if(s==='mt') g += '<text x="0" y="-25" text-anchor="middle" font-size="17" font-weight="700" fill="'+COL.maint+'"'+MS+'>M</text>';
  g += '<text x="-26" y="6" text-anchor="end" font-size="18" font-weight="700" fill="#FFFFFF"'+MS+'>'+id+'</text>';
  if(p.run) g += '<text x="26" y="6" font-size="17" font-weight="600" fill="'+COL.txt2+'"'+MS+'>'+(cd.ve?p.spd+' %':'TOR')+'</text>';
  return g+'</g>';
}
function pair(S, c, px, y, x0, x1, dir){
  var col = COL[c.fl], on = crun(S,c), xa=px-50, xb=px+50, dy=28;
  var g = '<path d="M'+x0+' '+y+' H'+xa+' M'+xb+' '+y+' H'+x1+'" fill="none" stroke="'+col+'" stroke-width="6" opacity="'+(on?1:.45)+'"/>';
  if(on) g += '<path d="M'+(dir>0?x0:x1)+' '+y+' H'+(dir>0?x1:x0)+'" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".55" class="flow"/>';
  g += '<path d="M'+xa+' '+y+' V'+(y-dy)+' H'+xb+' V'+y+' M'+xa+' '+y+' V'+(y+dy)+' H'+xb+' V'+y+'" fill="none" stroke="'+col+'" stroke-width="4.5" opacity="'+(on?.9:.4)+'"/>';
  g += pumpSVG(S, c.p[0], px, y-dy, dir) + pumpSVG(S, c.p[1], px, y+dy, dir);
  g += '<text x="'+px+'" y="'+(y+dy+42)+'" text-anchor="middle" font-size="17" font-weight="600" fill="'+COL.acc+'">rep. '+c.rep+'</text>';
  return g;
}
function ret(S, c, y, x0, x1, dir){
  var col = COL[c.fl], on = crun(S,c);
  var g = '<path d="M'+x0+' '+y+' H'+x1+'" fill="none" stroke="'+col+'" stroke-width="3.5" opacity="'+(on?.75:.3)+'" stroke-dasharray="'+(on?'':'6 6')+'"/>';
  if(on) g += '<path d="M'+(dir>0?x0:x1)+' '+y+' H'+(dir>0?x1:x0)+'" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity=".45" class="flow"/>';
  return g;
}
function cuve(x, y, w, h, nom, sous, T, fl){
  var lv = y + h*0.34, cx = x+w/2;
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="10" fill="'+COL.card+'" stroke="#2E4466" stroke-width="2"/>'+
    '<rect x="'+(x+3)+'" y="'+lv+'" width="'+(w-6)+'" height="'+(y+h-lv-3)+'" rx="7" fill="'+COL[fl]+'" opacity=".22"/>'+
    '<text x="'+cx+'" y="'+(y+30)+'" text-anchor="middle" font-size="17" font-weight="600" letter-spacing="1" fill="'+COL.txt2+'">'+nom+'</text>'+
    '<text x="'+cx+'" y="'+(y+54)+'" text-anchor="middle" font-size="17" fill="'+COL.txt2+'">'+sous+'</text>'+
    '<text x="'+cx+'" y="'+(y+h/2+44)+'" text-anchor="middle" font-size="46" font-weight="700" fill="#FFFFFF">'+fr(T)+'<tspan font-size="24" fill="'+COL.txt2+'" font-weight="400"> °C</tspan></text>'+
    '<text x="'+cx+'" y="'+(y+h/2+74)+'" text-anchor="middle" font-size="17" fill="'+COL.txt2+'">sonde Pt100</text>';
}
function boite(x, y, w, h, l1, l2, dash){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="6" fill="'+COL.card+'" stroke="'+(dash?COL.off:'#2E4466')+'" stroke-width="2"'+(dash?' stroke-dasharray="6 5"':'')+'/>'+
    '<text x="'+(x+w/2)+'" y="'+(y+h/2-3)+'" text-anchor="middle" font-size="19" font-weight="700" fill="'+(dash?COL.txt2:'#FFFFFF')+'">'+l1+'</text>'+
    '<text x="'+(x+w/2)+'" y="'+(y+h/2+20)+'" text-anchor="middle" font-size="17" fill="'+COL.txt2+'">'+l2+'</text>';
}
function synoptique(S){
  var F=C[0], c17=C[1], c18=C[2], c11=C[3], c13=C[4];
  var g = '<svg class="syn" viewBox="0 0 1280 470" width="1280" height="470" style="position:absolute;left:0;top:56px">';
  g += boite(40, 0, 240, 70, 'Groupes froid Toshiba', 'autonomes · hors armoire', true);
